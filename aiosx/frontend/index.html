<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIOS-X</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./animations.css" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-name {
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    #left-panel {
      width: 60%;
      position: relative;
    }

    #workflow-graph {
      width: 100%;
      height: 100%;
    }

    #particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #right-panel {
      width: 40%;
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
    }

    #input-area {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    #user-input {
      width: 100%;
      height: 60px;
      background: #020617;
      border: 1px solid #1e293b;
      color: white;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.88rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus {
      border-color: rgba(99, 102, 241, 0.7);
    }

    #output-panel {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }

    .voice-block {
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 8px;
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .plan-block {
      margin-bottom: 10px;
      padding: 8px 10px;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      font-size: 0.78rem;
      color: #a5b4fc;
    }

    .result-block {
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.12);
      padding: 10px;
      border-radius: 8px;
    }

    .result-block pre {
      margin: 0;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #cbd5e1;
    }

    .error {
      color: #f97316;
      font-size: 0.84rem;
    }

    #output-panel::-webkit-scrollbar { width: 5px; }
    #output-panel::-webkit-scrollbar-thumb {
      background: rgba(55, 65, 81, 0.8);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand-name">AIOS-X</div>
      <div class="controls">
        <button id="mic-btn">🎤</button>
        <button id="run-btn">Run</button>
      </div>
    </header>

    <main>
      <div id="left-panel">
        <canvas id="workflow-graph"></canvas>
        <canvas id="particles"></canvas>
      </div>

      <div id="right-panel">
        <div id="input-area">
          <textarea id="user-input" placeholder="Speak or type your query…"></textarea>
        </div>
        <div id="output-panel"></div>
      </div>
    </main>
  </div>

  <script src="./particles.js"></script>
  <script src="./graph.js"></script>
  <script type="module" src="./ui.js"></script>
</body>
</html>
